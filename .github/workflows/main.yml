name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          unzip -o KhushiMedicalBilling_Full_Source.zip -d appsource

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d $HOME
          echo "$HOME/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: appsource
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhushiMedicalBilling-APK
          path: appsource/app/build/outputs/apk/debug/app-debug.apk
